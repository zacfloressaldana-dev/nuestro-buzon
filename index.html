<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimori 💌</title>
<style>
  :root { --rojo: #c0192c; --rojo-oscuro: #7a0f1c; --rosa: #fde8ea; --borde: #f1b3ba; }
  body { font-family: Georgia, serif; background: var(--rosa); margin: 0; padding: 20px; color: #4a1520; max-width: 600px; margin-left: auto; margin-right: auto; }
  h1, h2 { text-align: center; color: var(--rojo-oscuro); }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 10px; border: 1px solid var(--borde); border-radius: 8px; font-size: 16px; font-family: inherit; background: #fffafa; }
  textarea { height: 180px; }
  button { background: var(--rojo); color: white; border: none; border-radius: 10px; padding: 10px 16px; font-size: 16px; margin: 4px 4px 4px 0; transition: transform .15s; }
  button:active { transform: scale(0.92); }
  .carta { background: white; border: 1px solid var(--borde); border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 3px 8px rgba(122,15,28,0.12); animation: aparecer .5s ease; }
  .bloqueada { opacity: 0.65; }
  .texto { margin-top: 10px; white-space: pre-wrap; display: none; line-height: 1.5; }
  .texto.abierto { display: block; animation: aparecer .8s ease; }
  #aviso, #saludo, #saludoSalas, #salaInfo { text-align: center; font-size: 18px; margin-bottom: 14px; }
  small { color: #a05a64; }

  #tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
  #tabs button { flex: 1; margin: 0; background: #e9a3ab; font-size: 15px; padding: 10px 4px; }
  #tabs button.activa { background: var(--rojo); }

  .gato { display: inline-block; animation: meneo 2s ease-in-out infinite; }
  .latido { display: inline-block; animation: latido 1.2s ease-in-out infinite; }

  #sellos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
  .sello { background: #f4dfe1; border: 2px dashed var(--borde); border-radius: 12px; padding: 10px 4px; text-align: center; font-size: 12px; filter: grayscale(1); opacity: .6; }
  .sello .ico { font-size: 34px; }
  .sello.ganado { background: white; border: 2px dashed var(--rojo); filter: none; opacity: 1; animation: pop .6s ease; }

  .pata { position: fixed; bottom: -50px; opacity: .13; pointer-events: none; z-index: -1; animation: subir linear infinite; }

  #lienzo { width: 100%; height: auto; background: white; border: 2px solid var(--borde); border-radius: 14px; touch-action: none; display: block; }
  #paleta { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
  .color { width: 36px; height: 36px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 1px #c9a0a6; margin: 0; padding: 0; }
  .color.elegido { box-shadow: 0 0 0 3px var(--rojo-oscuro); transform: scale(1.15); }
  #herr { text-align: center; }
  #grosor { width: 70%; padding: 0; margin: 8px 0; }

  #tabs button { font-size: 13px; }
  #mensajes { height: 55vh; overflow-y: auto; background: white; border: 2px solid var(--borde); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .burbuja { max-width: 80%; padding: 8px 12px; border-radius: 14px; margin: 6px 0; line-height: 1.35; word-wrap: break-word; animation: aparecer .3s ease; }
  .burbuja.mia { background: var(--rojo); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
  .burbuja.otra { background: #f6dde0; border-bottom-left-radius: 4px; }
  .burbuja.mia small { color: #ffd6da; }
  .burbuja .hora { font-size: 10px; opacity: .7; text-align: right; margin-top: 2px; }
  #barraChat { display: flex; gap: 6px; }
  #barraChat input { flex: 1; width: auto; margin: 0; }
  #barraChat button { margin: 0; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes meneo { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  @keyframes pop { 0% { transform: scale(0.5); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes subir { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-115vh) rotate(30deg); } }
</style>
</head>
<body>
<h1><span class="gato">🐱</span> Minimori <span class="latido">❤️</span></h1>

<div id="pantallaAuth">
  <input id="inEmail" type="email" placeholder="Tu correo">

    <button id="btnVolverSalas">← Mis salas</button>

  </div>

  <div id="tabs">
    <button id="tabCartas" class="activa">💌 Cartas</button>
    <button id="tabChat">💬 Chat</button>
    <button id="tabLienzo">🎨 Lienzo</button>
  <div id="vistaChat" style="display:none">
    <h2>Chat 💬</h2>
    <div id="mensajes"></div>
    <div id="barraChat">
      <input id="inMensaje" placeholder="Escribe un mensaje..." maxlength="500" autocomplete="off">
      <button id="btnMandar">➤</button>
    </div>
  </div>
    <button id="tabLectura">📖 Lectura</button>
  </div>

  <div id="vistaCartas">
    <div id="aviso"></div>
    <button id="btnEscribir">✍️ Escribir carta</button>

    <div id="formEscribir" style="display:none; margin-top:14px">
      <input id="inTitulo" placeholder="Título de la carta">
      <textarea id="inTexto" placeholder="Escribe aquí lo que sientes..."></textarea>
      <button id="btnEnviar">Enviar 💌</button>
      <br><small>Los demás de la sala la podrán abrir mañana.</small>
    </div>

    <h2 id="tituloSellos">Mis sellos</h2>
    <div id="sellos"></div>

    <h2>Para ti 🐾</h2>
    <div id="recibidas"></div>
    <h2>Enviadas por ti</h2>
    <div id="enviadas"></div>
  </div>

  <div id="vistaLienzo" style="display:none">
    <small>Lo que una persona dibuje, las demás lo ven al instante 🎨</small>
    <canvas id="lienzo" width="800" height="500"></canvas>
    <div id="paleta"></div>
    <div id="herr">
      <input type="range" id="grosor" min="2" max="30" value="5"><br>
      <button id="btnDeshacer">↩️ Deshacer</button>
      <button id="btnBorrador">🧽 Borrador</button>
      <button id="btnLimpiar">🗑️ Limpiar todo</button>
      <button id="btnDescargar">🖼️ Descargar</button>
    </div>
  </div>

  <div id="vistaLectura" style="display:none">
    <h2>Rincón de lectura 📖</h2>
    <div id="listaLecturas"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, onSnapshot, query, where, serverTimestamp, doc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// CONFIG AQUI (Ctrl+F esto)
const firebaseConfig = {
  apiKey: "AIzaSyBLwa0Z182A8A4FTD88EzNMTNDz2h9BI70",
  authDomain: "nuestro-buzon.firebaseapp.com",
  projectId: "nuestro-buzon",
  storageBucket: "nuestro-buzon.firebasestorage.app",
  messagingSenderId: "431142936272",
  appId: "1:431142936272:web:72680adfee3a0600c548d5"
};

// FECHA DE ANIVERSARIO (Ctrl+F esto)
const ANIVERSARIO = "2026-10-20";

// SELLOS AQUI (Ctrl+F esto para agregar sellos nuevos)
const SELLOS = [
  { icono: "💌", nombre: "Primera carta enviada", ok: function (c) { return c.enviadas >= 1; } },
  { icono: "📬", nombre: "Primera carta recibida", ok: function (c) { return c.abiertas >= 1; } },
  { icono: "🐱", nombre: "Cinco cartas enviadas", ok: function (c) { return c.enviadas >= 5; } },
  { icono: "🎨", nombre: "Diez cartas enviadas", ok: function (c) { return c.enviadas >= 10; } },
  { icono: "❤️", nombre: "Un mes juntas", ok: function (c) { return c.hoy >= ANIVERSARIO; } }
];

// LECTURAS AQUI (Ctrl+F esto para agregar cuentos o poemas)
const LECTURAS = [
  {
    titulo: "El gatito que guardaba cartas 🐱",
    texto: `Había una vez un gatito que vivía debajo de una ventana. Todas las noches encontraba cartas que el viento dejaba caer, y las guardaba en una cajita de cartón.

Nadie sabía por qué las guardaba. Un día alguien le preguntó, y el gatito contestó: "Porque cada carta es alguien diciendo que le importa otra persona, y eso merece cuidarse".

Desde entonces, la cajita nunca estuvo vacía.`
  }
];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const cartasRef = collection(db, "cartas");
const trazosRef = collection(db, "trazos");
const salasRef = collection(db, "salas");
const mensajesRef = collection(db, "mensajes");

let uid = "";
let yoNombre = "";
let salaCodigo = "";
let unsubSalas = null;
let unsubCartas = null;
let unsubTrazos = null;
let unsubChat = null;

const $ = function (id) { return document.getElementById(id); };

function hoyStr() { return new Date().toLocaleDateString("en-CA"); }

function sumarDia(f) {
  const d = new Date(f + "T00:00:00");
  d.setDate(d.getDate() + 1);
  return d.toLocaleDateString("en-CA");
}

// HUELLITAS DE FONDO (Ctrl+F esto)
for (let i = 0; i < 8; i++) {
  const p = document.createElement("span");
  p.className = "pata";
  p.textContent = "🐾";
  p.style.left = (Math.random() * 95) + "%";
  p.style.fontSize = (22 + Math.random() * 20) + "px";
  p.style.animationDuration = (14 + Math.random() * 12) + "s";
  p.style.animationDelay = "-" + (Math.random() * 20) + "s";
  document.body.appendChild(p);
}

// PANTALLAS (Ctrl+F esto)
function mostrarPantalla(id) {
  ["pantallaAuth", "pantallaSalas", "pantallaBuzon"].forEach(function (p) {
    $(p).style.display = p === id ? "block" : "none";
  });
}

// PESTAÑAS (Ctrl+F esto)
const VISTAS = { cartas: "vistaCartas", chat: "vistaChat", lienzo: "vistaLienzo", lectura: "vistaLectura" };
const TABS = { cartas: "tabCartas", chat: "tabChat", lienzo: "tabLienzo", lectura: "tabLectura" };
function ver(nombre) {
  Object.keys(VISTAS).forEach(function (k) {
    $(VISTAS[k]).style.display = k === nombre ? "block" : "none";
    $(TABS[k]).className = k === nombre ? "activa" : "";
  });
  if (nombre === "chat") { const c = $("mensajes"); c.scrollTop = c.scrollHeight; }
}
$("tabCartas").onclick = function () { ver("cartas"); };
$("tabChat").onclick = function () { ver("chat"); };
$("tabLienzo").onclick = function () { ver("lienzo"); };
$("tabLectura").onclick = function () { ver("lectura"); };

// LECTURAS (Ctrl+F esto)
function pintarLecturas() {
  const cont = $("listaLecturas");
  cont.innerHTML = "";
  LECTURAS.forEach(function (l) {
    const div = document.createElement("div");
    div.className = "carta";
    const t = document.createElement("b");
    t.textContent = l.titulo;
    const br = document.createElement("br");
    const btn = document.createElement("button");
    btn.textContent = "Leer 📖";
    const texto = document.createElement("div");
    texto.className = "texto";
    texto.textContent = l.texto;
    btn.onclick = function () {
      const abierto = texto.className === "texto abierto";
      texto.className = abierto ? "texto" : "texto abierto";
      btn.textContent = abierto ? "Leer 📖" : "Cerrar";
    };
    div.appendChild(t); div.appendChild(br); div.appendChild(btn); div.appendChild(texto);
    cont.appendChild(div);
  });
}
pintarLecturas();

// LIENZO (Ctrl+F esto)
const canvas = $("lienzo");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;
const COLORES = ["#c0192c", "#000000", "#1e63d6", "#1f9d55", "#f2b705", "#ff7aa8", "#7b3fb5", "#8b5a2b"];
let colorActual = COLORES[0];
let trazos = [];
let actual = null;
let dibujando = false;

function trazarSegmento(color, grosor, x1, y1, x2, y2) {
  ctx.strokeStyle = color;
  ctx.lineWidth = grosor;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function dibujarTrazo(t) {
  const p = t.puntos;
  if (p.length < 2) return;
  if (p.length === 2) {
    trazarSegmento(t.color, t.grosor, p[0] * W, p[1] * H, p[0] * W + 0.1, p[1] * H);
    return;
  }
  ctx.strokeStyle = t.color;
  ctx.lineWidth = t.grosor;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(p[0] * W, p[1] * H);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * W, p[i + 1] * H);
  ctx.stroke();
}

function redibujar() {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);
  trazos.forEach(dibujarTrazo);
  if (actual) dibujarTrazo(actual);
}
redibujar();

function posicion(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
function redondear(n) { return Math.round(n * 1000) / 1000; }

canvas.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  dibujando = true;
  const p = posicion(e);
  actual = { color: colorActual, grosor: Number($("grosor").value), puntos: [redondear(p[0]), redondear(p[1])] };
  redibujar();
});

canvas.addEventListener("pointermove", function (e) {
  if (!dibujando || !actual) return;
  e.preventDefault();
  const p = posicion(e);
  const n = actual.puntos.length;
  const px = actual.puntos[n - 2];
  const py = actual.puntos[n - 1];
  if (Math.abs(p[0] - px) < 0.002 && Math.abs(p[1] - py) < 0.002) return;
  if (n >= 3000) return;
  actual.puntos.push(redondear(p[0]), redondear(p[1]));
  trazarSegmento(actual.color, actual.grosor, px * W, py * H, p[0] * W, p[1] * H);
});

async function terminarTrazo() {
  if (!dibujando || !actual) return;
  dibujando = false;
  const t = actual;
  actual = null;
  if (!salaCodigo) return;
  try {
    await addDoc(trazosRef, { sala: salaCodigo, uid: uid, de: yoNombre, color: t.color, grosor: t.grosor, puntos: t.puntos, t: Date.now() });
  } catch (err) {
    alert("No se pudo guardar el trazo: " + err.message);
    redibujar();
  }
}
canvas.addEventListener("pointerup", terminarTrazo);
canvas.addEventListener("pointercancel", terminarTrazo);

// PALETA (Ctrl+F esto)
function pintarPaleta() {
  const cont = $("paleta");
  cont.innerHTML = "";
  COLORES.forEach(function (c) {
    const b = document.createElement("button");
    b.className = "color" + (c === colorActual ? " elegido" : "");
    b.style.background = c;
    b.onclick = function () { colorActual = c; pintarPaleta(); };
    cont.appendChild(b);
  });
}
pintarPaleta();

$("btnBorrador").onclick = function () { colorActual = "#ffffff"; pintarPaleta(); };

$("btnDeshacer").onclick = async function () {
  const mios = trazos.filter(function (t) { return t.uid === uid; });
  if (mios.length === 0) return;
  const ultimo = mios[mios.length - 1];
  try { await deleteDoc(ultimo.ref); } catch (err) { alert("No se pudo deshacer: " + err.message); }
};

$("btnLimpiar").onclick = async function () {
  if (!confirm("¿Seguro que quieres borrar TODO el lienzo? Se borra para toda la sala.")) return;
  try {
    await Promise.all(trazos.map(function (t) { return deleteDoc(t.ref); }));
  } catch (err) {
    alert("No se pudo limpiar: " + err.message);
  }
};

$("btnDescargar").onclick = function () {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "nuestro-dibujo.png";
  a.click();
};

// CUENTAS (Ctrl+F esto)
function mensajeError(e) {
  const m = {
    "auth/invalid-email": "El correo no es válido.",
    "auth/missing-password": "Falta la contraseña.",
    "auth/weak-password": "La contraseña es muy corta (mínimo 6 caracteres).",
    "auth/email-already-in-use": "Ese correo ya tiene una cuenta.",
    "auth/invalid-credential": "Correo o contraseña incorrectos.",
    "auth/user-not-found": "No existe una cuenta con ese correo.",
    "auth/wrong-password": "Contraseña incorrecta.",
    "auth/too-many-requests": "Demasiados intentos, espera un rato.",
    "auth/network-request-failed": "No hay conexión a internet."
  };
  return m[e.code] || e.message;
}

function pintarSaludo() {
  $("saludoSalas").textContent = "Hola, " + yoNombre + " 💕";
  $("saludo").textContent = "Hola, " + yoNombre + " 💕";
}

$("btnEntrar").onclick = async function () {
  const email = $("inEmail").value.trim();
  const pass = $("inPass").value;
  if (!email || !pass) { alert("Pon tu correo y tu contraseña"); return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    alert(mensajeError(e));
  }
};

$("btnRegistro").onclick = async function () {
  const email = $("inEmail").value.trim();
  const pass = $("inPass").value;
  const nombre = $("inNombre").value.trim();
  if (!email || !pass || !nombre) { alert("Para crear cuenta pon correo, contraseña y tu nombre o apodo"); return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: nombre });
    yoNombre = nombre;
    pintarSaludo();
  } catch (e) {
    alert(mensajeError(e));
  }
};

$("btnOlvide").onclick = async function () {
  const email = $("inEmail").value.trim();
  if (!email) { alert("Escribe tu correo arriba y vuelve a darle"); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    alert("Te mandé un correo para cambiar tu contraseña. Revisa también spam.");
  } catch (e) {
    alert(mensajeError(e));
  }
};

$("btnCerrarSesion").onclick = function () { signOut(auth); };

// SALAS (Ctrl+F esto)
function codigoNuevo() {
  const letras = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const bytes = new Uint8Array(8);
  crypto.getRandomValues(bytes);
  let c = "";
  for (let i = 0; i < bytes.length; i++) c += letras[bytes[i] % letras.length];
  return c;
}

function salirDeSala() {
  if (unsubCartas) { unsubCartas(); unsubCartas = null; }
  if (unsubTrazos) { unsubTrazos(); unsubTrazos = null; }
  if (unsubChat) { unsubChat(); unsubChat = null; }
  $("mensajes").innerHTML = "";
  trazos = [];
  actual = null;
  dibujando = false;
  salaCodigo = "";
  redibujar();
}

function mostrarSalas() {
  salirDeSala();
  mostrarPantalla("pantallaSalas");
  pintarSaludo();
  if (unsubSalas) unsubSalas();
  const q = query(salasRef, where("miembros", "array-contains", uid));
  unsubSalas = onSnapshot(q, function (snap) {
    const cont = $("listaSalas");
    cont.innerHTML = "";
    if (snap.empty) { cont.textContent = "Todavía no estás en ninguna sala."; return; }
    snap.docs.forEach(function (d) {
      const s = d.data();
      const div = document.createElement("div");
      div.className = "carta";
      const t = document.createElement("b");
      t.textContent = "🏠 " + s.nombre + " ";
      const c = document.createElement("small");
      c.textContent = "(código: " + d.id + ")";
      const btn = document.createElement("button");
      btn.textContent = "Entrar";
      btn.onclick = function () { entrarSala(d.id, s.nombre); };
      div.appendChild(t); div.appendChild(c); div.appendChild(document.createElement("br")); div.appendChild(btn);
      cont.appendChild(div);
    });
  }, function (err) {
    alert("Error al cargar tus salas: " + err.message);
  });
}

$("btnCrearSala").onclick = async function () {
  const nombre = $("inNombreSala").value.trim();
  if (!nombre) { alert("Ponle un nombre a la sala"); return; }
  const codigo = codigoNuevo();
  const nombres = {};
  nombres[uid] = yoNombre;
  try {
    await setDoc(doc(db, "salas", codigo), { nombre: nombre, miembros: [uid], nombres: nombres, creada: serverTimestamp() });
    $("inNombreSala").value = "";
    alert("Sala creada 🏠\nCódigo para invitar: " + codigo);
  } catch (e) {
    alert("No se pudo crear la sala: " + e.message);
  }
};

$("btnUnirme").onclick = async function () {
  const codigo = $("inCodigo").value.trim().toUpperCase();
  if (!codigo) { alert("Escribe el código"); return; }
  const cambios = { miembros: arrayUnion(uid) };
  cambios["nombres." + uid] = yoNombre;
  try {
    await updateDoc(doc(db, "salas", codigo), cambios);
    $("inCodigo").value = "";
    alert("¡Listo, ya estás en la sala! 🎉");
  } catch (e) {
    alert("No se pudo entrar: revisa que el código esté bien escrito.");
  }
};

function entrarSala(codigo, nombre) {
  salaCodigo = codigo;
  mostrarPantalla("pantallaBuzon");
  pintarSaludo();
  $("salaInfo").textContent = "🏠 " + nombre + " · código: " + codigo;
  ver("cartas");
  escuchar();
  escucharChat();
}

$("btnVolverSalas").onclick = mostrarSalas;

$("btnCopiar").onclick = async function () {
  try {
    await navigator.clipboard.writeText(salaCodigo);
    alert("Código copiado 📋");
  } catch (e) {
    prompt("Copia este código:", salaCodigo);
  }
};

function escuchar() {
  const q = query(cartasRef, where("sala", "==", salaCodigo));
  unsubCartas = onSnapshot(q, function (snap) {
    const todas = snap.docs.map(function (d) { return d.data(); });
    pintar(todas);
  }, function (err) {
    alert("Error con las cartas: " + err.message);
  });

  const qt = query(trazosRef, where("sala", "==", salaCodigo));
  unsubTrazos = onSnapshot(qt, function (snap) {
    trazos = snap.docs.map(function (d) {
      const x = d.data();
      x.ref = d.ref;
      return x;
    });
    trazos.sort(function (a, b) { return a.t - b.t; });
    redibujar();
  }, function (err) {
    alert("Error con el lienzo: " + err.message);
  });
}

function pintarSellos(ctxSellos) {
  const cont = $("sellos");
  cont.innerHTML = "";
  let ganados = 0;
  SELLOS.forEach(function (s) {
    const ok = s.ok(ctxSellos);
    if (ok) ganados++;
    const d = document.createElement("div");
    d.className = "sello" + (ok ? " ganado" : "");
    d.innerHTML = "<div class='ico'>" + (ok ? s.icono : "🔒") + "</div><div>" + s.nombre + "</div>";
    cont.appendChild(d);
  });
  $("tituloSellos").textContent = "Mis sellos (" + ganados + "/" + SELLOS.length + ")";
}

function pintar(todas) {
  const hoy = hoyStr();
  const recibidas = todas.filter(function (c) { return c.uid !== uid; });
  const enviadas = todas.filter(function (c) { return c.uid === uid; });
  recibidas.sort(function (a, b) { return b.fecha.localeCompare(a.fecha); });
  enviadas.sort(function (a, b) { return b.fecha.localeCompare(a.fecha); });

  const contR = $("recibidas");
  contR.innerHTML = "";
  let nuevas = 0;
  recibidas.forEach(function (c) {
    const abierta = sumarDia(c.fecha) <= hoy;
    const div = document.createElement("div");
    div.className = "carta" + (abierta ? "" : " bloqueada");
    if (abierta) {
      nuevas++;
      const t = document.createElement("b");
      t.textContent = "💌 " + c.titulo + " ";
      const de = document.createElement("small");
      de.textContent = "de " + c.de + " (" + c.fecha + ")";
      const btn = document.createElement("button");
      btn.textContent = "Abrir 💌";
      const texto = document.createElement("div");
      texto.className = "texto";
      texto.textContent = c.texto;
      btn.onclick = function () { texto.className = "texto abierto"; btn.style.display = "none"; };
      div.appendChild(t); div.appendChild(de); div.appendChild(document.createElement("br"));
      div.appendChild(btn); div.appendChild(texto);
    } else {
      div.textContent = "🔒 Una carta de " + c.de + " se abre el " + sumarDia(c.fecha);
    }
    contR.appendChild(div);
  });
  if (recibidas.length === 0) contR.textContent = "Todavía no hay cartas para ti.";

  const contE = $("enviadas");
  contE.innerHTML = "";
  enviadas.forEach(function (c) {
    const div = document.createElement("div");
    div.className = "carta";
    const t = document.createElement("b");
    t.textContent = "📤 " + c.titulo + " ";
    const f = document.createElement("small");
    f.textContent = "(" + c.fecha + ")";
    const texto = document.createElement("div");
    texto.style.whiteSpace = "pre-wrap";
    texto.style.marginTop = "8px";
    texto.textContent = c.texto;
    div.appendChild(t); div.appendChild(f); div.appendChild(texto);
    contE.appendChild(div);
  });
  if (enviadas.length === 0) contE.textContent = "Aún no has escrito cartas.";

  $("aviso").textContent = nuevas > 0 ? "Tienes " + nuevas + " carta(s) 💌🐾" : "Aún no hay cartas nuevas";

  pintarSellos({ enviadas: enviadas.length, abiertas: nuevas, hoy: hoy });
}

$("btnEscribir").onclick = function () {
  const f = $("formEscribir");
  f.style.display = f.style.display === "none" ? "block" : "none";
};

$("btnEnviar").onclick = async function () {
  const titulo = $("inTitulo").value.trim();
  const texto = $("inTexto").value.trim();
  if (!titulo || !texto) { alert("Falta el título o la carta"); return; }
  try {
    await addDoc(cartasRef, { sala: salaCodigo, uid: uid, de: yoNombre, titulo: titulo, texto: texto, fecha: hoyStr(), creada: serverTimestamp() });
    $("inTitulo").value = "";
    $("inTexto").value = "";
    $("formEscribir").style.display = "none";
    alert("Carta enviada 💌");
  } catch (e) {
    alert("No se pudo enviar: " + e.message);
  }
};

// CHAT (Ctrl+F esto)
function pintarMensajes(lista) {
  const cont = $("mensajes");
  const alFinal = cont.scrollHeight - cont.scrollTop - cont.clientHeight < 80;
  cont.innerHTML = "";
  if (lista.length === 0) {
    cont.textContent = "Aún no hay mensajes. ¡Escribe el primero! 💬";
    return;
  }
  lista.forEach(function (m) {
    const mio = m.uid === uid;
    const burbuja = document.createElement("div");
    burbuja.className = "burbuja " + (mio ? "mia" : "otra");
    if (!mio) {
      const n = document.createElement("small");
      n.textContent = m.de;
      burbuja.appendChild(n);
      burbuja.appendChild(document.createElement("br"));
    }
    const t = document.createElement("span");
    t.textContent = m.texto;
    burbuja.appendChild(t);
    const h = document.createElement("div");
    h.className = "hora";
    h.textContent = new Date(m.t).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
    burbuja.appendChild(h);
    cont.appendChild(burbuja);
  });
  if (alFinal) cont.scrollTop = cont.scrollHeight;
}

function escucharChat() {
  const q = query(mensajesRef, where("sala", "==", salaCodigo));
  unsubChat = onSnapshot(q, function (snap) {
    const lista = snap.docs.map(function (d) { return d.data(); });
    lista.sort(function (a, b) { return a.t - b.t; });
    pintarMensajes(lista.slice(-200));
  }, function (err) {
    alert("Error con el chat: " + err.message);
  });
}

async function mandarMensaje() {
  const texto = $("inMensaje").value.trim();
  if (!texto || !salaCodigo) return;
  $("inMensaje").value = "";
  try {
    await addDoc(mensajesRef, { sala: salaCodigo, uid: uid, de: yoNombre, texto: texto, t: Date.now() });
  } catch (e) {
    $("inMensaje").value = texto;
    alert("No se pudo mandar: " + e.message);
  }
}
$("btnMandar").onclick = mandarMensaje;
$("inMensaje").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); mandarMensaje(); }
});

// ARRANQUE (Ctrl+F esto)
localStorage.removeItem("buzon");
onAuthStateChanged(auth, function (user) {
  if (user) {
    uid = user.uid;
    yoNombre = user.displayName || (user.email || "").split("@")[0];
    mostrarSalas();
  } else {
    uid = "";
    yoNombre = "";
    if (unsubSalas) { unsubSalas(); unsubSalas = null; }
    salirDeSala();
    mostrarPantalla("pantallaAuth");
  }
});
</script>
